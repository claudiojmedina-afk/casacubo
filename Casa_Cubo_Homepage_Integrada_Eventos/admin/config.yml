backend:
  name: github
  repo: claudiojmedina-afk/casacubo
  branch: main
  base_url: https://broken-shadow-f966.claudiojmedina.workers.dev
  auth_endpoint: auth

local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:

  - name: "inicio"
    label: "Inicio"
    media_folder: "Casa_Cubo_Homepage_Integrada_Eventos/assets/uploads"
    public_folder: "/assets/uploads"

    files:
      - label: "Carrusel y popup"
        name: "contenido_inicio"
        file: "Casa_Cubo_Homepage_Integrada_Eventos/content/_data/home.json"

        fields:
          - label: "Carrusel principal"
            name: "hero_carousel"
            widget: "list"
            summary: "{{fields.alt}}"
            hint: "Podés agregar, quitar y reordenar imágenes."
            fields:
              - { label: "Imagen", name: "image", widget: "image" }
              - { label: "Texto alternativo", name: "alt", widget: "string", required: false }
              - { label: "Link", name: "link", widget: "string", required: false, hint: "Dejalo vacío si la imagen no debe llevar a ningún lugar." }
              - { label: "Abrir en nueva pestaña", name: "new_tab", widget: "boolean", default: false }

          - label: "Popup"
            name: "popup"
            widget: "object"
            fields:
              - { label: "Activar popup", name: "enabled", widget: "boolean", default: false }
              - { label: "Identificador", name: "id", widget: "string", default: "general", hint: "Cambialo cuando publiques un popup nuevo para que pueda volver a mostrarse." }
              - { label: "Título", name: "title", widget: "string", default: "Algo nuevo está pasando en Casa Cubo" }
              - { label: "Texto", name: "text", widget: "text", required: false }
              - { label: "Imagen", name: "image", widget: "image", required: false }
              - { label: "Texto del botón", name: "button_text", widget: "string", required: false, default: "Ver experiencias" }
              - { label: "Link del botón", name: "button_link", widget: "string", required: false, default: "/eventos/" }
              - { label: "Abrir link en nueva pestaña", name: "new_tab", widget: "boolean", default: false }
              - { label: "Demora en segundos", name: "delay_seconds", widget: "number", value_type: "int", min: 0, default: 12 }
              - { label: "Volver a mostrar después de X días", name: "repeat_days", widget: "number", value_type: "int", min: 0, default: 7, hint: "Usá 0 para permitir que vuelva a mostrarse en cada nueva visita." }

  - name: "eventos"
    label: "Eventos"
    label_singular: "Evento"
    folder: "Casa_Cubo_Homepage_Integrada_Eventos/content/eventos"
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    sortable_fields: ["sort_date", "title", "status"]
    summary: "{{title}} — {{sort_date}}"

    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "Será parte de la URL. Ej.: taller-de-ceramica" }
      - { label: "Categoría", name: "category", widget: "select", options: ["Taller", "Experiencia", "Evento", "Exposición"] }
      - { label: "Estado", name: "status", widget: "select", options: ["borrador", "publicado", "finalizado"], default: "borrador" }
      - { label: "Fecha principal", name: "sort_date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ss" }
      - { label: "Horario", name: "time", widget: "string" }
      - { label: "Duración", name: "duration", widget: "string", required: false }
      - { label: "Lugar", name: "location", widget: "string", default: "Casa Cubo" }
      - { label: "Precio", name: "price", widget: "number", value_type: "int", required: false }
      - { label: "Imagen principal", name: "image", widget: "image" }
      - { label: "Resumen", name: "excerpt", widget: "text" }
      - { label: "Público", name: "audience", widget: "string", required: false }

      - label: "Instructores"
        name: "instructors"
        widget: "list"
        required: false
        fields:
          - { label: "Nombre", name: "name", widget: "string" }
          - { label: "Rol / profesión", name: "role", widget: "string", required: false }
          - { label: "Foto", name: "image", widget: "image", required: false }

      - label: "Qué incluye"
        name: "include"
        widget: "list"
        field:
          { label: "Ítem", name: "item", widget: "string" }

      - label: "Qué traer"
        name: "bring"
        widget: "list"
