backend:
  name: github
  repo: claudiojmedina-afk/casacubo
  branch: main
  base_url: https://broken-shadow-f966.claudiojmedina.workers.dev
  auth_endpoint: auth

local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:

  # ==========================================================
  # INICIO
  # ==========================================================

  - name: "inicio"
    label: "Inicio"

    media_folder: "Casa_Cubo_Homepage_Integrada_Eventos/assets/uploads"
    public_folder: "/assets/uploads"

    files:

      - label: "Carrusel y popup"
        name: "contenido_inicio"
        file: "Casa_Cubo_Homepage_Integrada_Eventos/content/_data/home.json"

        fields:

          # CARRUSEL

          - label: "Carrusel principal"
            name: "hero_carousel"
            widget: "list"
            summary: "{{fields.alt}}"
            hint: "Podés agregar, quitar y reordenar imágenes."

            fields:

              - label: "Imagen"
                name: "image"
                widget: "image"

              - label: "Texto alternativo"
                name: "alt"
                widget: "string"
                required: false
                hint: "Descripción breve de la imagen."

              - label: "Link"
                name: "link"
                widget: "string"
                required: false
                hint: "Dejalo vacío si la imagen no debe llevar a ningún lugar."

              - label: "Abrir en nueva pestaña"
                name: "new_tab"
                widget: "boolean"
                default: false

          # POPUP

          - label: "Popup"
            name: "popup"
            widget: "object"

            fields:

              - label: "Activar popup"
                name: "enabled"
                widget: "boolean"
                default: false

              - label: "Identificador"
                name: "id"
                widget: "string"
                default: "general"
                hint: "Cambialo cuando publiques un popup nuevo para que pueda volver a mostrarse."

              - label: "Título"
                name: "title"
                widget: "string"
                default: "Algo nuevo está pasando en Casa Cubo"

              - label: "Texto"
                name: "text"
                widget: "text"
                required: false

              - label: "Imagen"
                name: "image"
