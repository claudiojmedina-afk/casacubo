backend:
  name: github
  repo: claudiojmedina-afk/casacubo
  branch: main
  base_url: https://broken-shadow-f966.claudiojmedina.workers.dev
  auth_endpoint: auth

local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:

  - name: "inicio"
    label: "Inicio"

    media_folder: "Casa_Cubo_Homepage_Integrada_Eventos/assets/uploads"
    public_folder: "/assets/uploads"

    files:
      - label: "Carrusel y popup"
        name: "contenido_inicio"
        file: "Casa_Cubo_Homepage_Integrada_Eventos/content/_data/home.json"

        fields:
          - label: "Carrusel principal"
            name: "hero_carousel"
            widget: "list"
            summary: "{{fields.alt}}"
            hint: "Podés agregar, quitar y reordenar imágenes."

            fields:
              - label: "Imagen"
                name: "image"
                widget: "image"

              - label: "Texto alternativo"
                name: "alt"
                widget: "string"
                required: false
                hint: "Descripción breve de la imagen."

              - label: "Link"
                name: "link"
                widget: "string"
                required: false
                hint: "Dejalo vacío si la imagen no debe llevar a ningún lugar."

              - label: "Abrir en nueva pestaña"
                name: "new_tab"
                widget: "boolean"
                default: false

          - label: "Popup"
            name: "popup"
            widget: "object"

            fields:
              - label: "Activar popup"
                name: "enabled"
                widget: "boolean"
                default: false

              - label: "Identificador"
                name: "id"
                widget: "string"
                default: "general"
                hint: "Cambialo cuando publiques un popup nuevo para que pueda volver a mostrarse."

              - label: "Título"
                name: "title"
                widget: "string"
                default: "Algo nuevo está pasando en Casa Cubo"

              - label: "Texto"
                name: "text"
                widget: "text"
                required: false

              - label: "Imagen"
                name: "image"
                widget: "image"
                required: false

              - label: "Texto del botón"
                name: "button_text"
                widget: "string"
                required: false
                default: "Ver experiencias"

              - label: "Link del botón"
                name: "button_link"
                widget: "string"
                required: false
                default: "/eventos/"

              - label: "Abrir link en nueva pestaña"
                name: "new_tab"
                widget: "boolean"
                default: false

              - label: "Demora en segundos"
                name: "delay_seconds"
                widget: "number"
                value_type: "int"
                min: 0
                default: 12

              - label: "Volver a mostrar después de X días"
                name: "repeat_days"
                widget: "number"
                value_type: "int"
                min: 0
                default: 7
                hint: "Usá 0 para permitir que vuelva a mostrarse en cada nueva visita."

  - name: "eventos"
    label: "Eventos"
    label_singular: "Evento"

    folder: "Casa_Cubo_Homepage_Integrada_Eventos/content/eventos"
    create: true
    path: "{{slug}}/index"

    media_folder: ""
    public_folder: ""

    sortable_fields:
      - sort_date
      - title
      - status

    summary: "{{title}} — {{sort_date}}"

    fields:
      - label: "Título"
        name: "title"
        widget: "string"

      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "Será parte de la URL. Ej.: taller-de-ceramica"

      - label: "Tipo"
        name: "category"
        widget: "select"
        options:
          - "Taller"
          - "Experiencia"
          - "Evento"
          - "Exposición"

      - label: "Categorías"
        name: "categories"
        widget: "list"
        required: false
        hint: "Agregá una o varias categorías. Ej.: Fotografía, Pintura, Cerámica."
        field:
          label: "Categoría"
          name: "category"
          widget: "string"

      - label: "Estado"
        name: "status"
        widget: "select"
        options:
          - "borrador"
          - "publicado"
          - "finalizado"
        default: "borrador"

      - label: "Fecha principal"
        name: "sort_date"
        widget: "datetime"
        date_format: "DD/MM/YYYY"
        time_format: "HH:mm"
        format: "YYYY-MM-DDTHH:mm:ss"

      - label: "Horario"
        name: "time"
        widget: "string"
        required: false

      - label: "Duración"
        name: "duration"
        widget: "string"
        required: false

      - label: "Lugar"
        name: "location"
        widget: "string"
        required: false
        default: "Casa Cubo"

      - label: "Precio"
        name: "price"
        widget: "number"
        value_type: "int"
        required: false

      - label: "Imagen principal"
        name: "image"
        widget: "image"

      - label: "Resumen"
        name: "excerpt"
        widget: "text"

      - label: "Público"
        name: "audience"
        widget: "string"
        required: false

      - label: "Instructores"
        name: "instructors"
        widget: "list"
        required: false

        fields:
          - label: "Nombre"
            name: "name"
            widget: "string"

          - label: "Rol / profesión"
            name: "role"
            widget: "string"
            required: false

          - label: "Foto"
            name: "image"
            widget: "image"
            required: false

      - label: "Qué incluye"
        name: "include"
        widget: "list"
        required: false

        field:
          label: "Ítem"
          name: "item"
          widget: "string"

      - label: "Qué traer"
        name: "bring"
        widget: "list"
        required: false

        field:
          label: "Ítem"
          name: "item"
          widget: "string"

      - label: "Formulario de inscripción"
        name: "form_url"
        widget: "string"
        required: false
        hint: "Dejalo vacío si este evento no requiere inscripción. Si usás Google Forms, se recomienda terminar con ?embedded=true."

      - label: "Contenido"
        name: "body"
        widget: "markdown"
        required: false

      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "evento.njk"

      - label: "Permalink"
        name: "permalink"
        widget: "hidden"
        default: "/eventos/{{slug}}/"

      - label: "Tags"
        name: "tags"
        widget: "hidden"
        default: "eventos"

  - name: "crear_nuevos_mundos"
    label: "Crear Nuevos Mundos"

    media_folder: "Casa_Cubo_Homepage_Integrada_Eventos/assets/uploads"
    public_folder: "/assets/uploads"

    files:
      - label: "Página principal"
        name: "pagina"
        file: "Casa_Cubo_Homepage_Integrada_Eventos/content/crear-nuevos-mundos/index.md"

        fields:
          - label: "Texto superior"
            name: "eyebrow"
            widget: "string"

          - label: "Título"
            name: "title"
            widget: "string"

          - label: "Introducción"
            name: "intro"
            widget: "text"

          - label: "Imagen principal"
            name: "hero_image"
            widget: "image"

          - label: "Título agenda"
            name: "agenda_title"
            widget: "string"

          - label: "Texto agenda"
            name: "agenda_text"
            widget: "text"

          - label: "Imagen agenda semanal"
            name: "agenda_image"
            widget: "image"

          - label: "Layout"
            name: "layout"
            widget: "hidden"
            default: "crear-nuevos-mundos.njk"

          - label: "Permalink"
            name: "permalink"
            widget: "hidden"
            default: "/crear-nuevos-mundos/"

  - name: "talleres_regulares"
    label: "Talleres regulares"
    label_singular: "Taller regular"

    folder: "Casa_Cubo_Homepage_Integrada_Eventos/content/talleres-regulares"
    create: true
    path: "{{slug}}/index"

    media_folder: "Casa_Cubo_Homepage_Integrada_Eventos/assets/uploads"
    public_folder: "/assets/uploads"

    sortable_fields:
      - title
      - audience
      - status

    summary: "{{title}} — {{audience}}"

    fields:
      - label: "Título"
        name: "title"
        widget: "string"

      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "Ej.: ceramica-inicial"

      - label: "Estado"
        name: "status"
        widget: "select"
        options:
          - "borrador"
          - "publicado"
          - "finalizado"
        default: "borrador"

      - label: "Categorías"
        name: "categories"
        widget: "list"
        required: false
        hint: "Agregá todas las categorías que correspondan. Ej.: Fotografía, Pintura, Cerámica."
        field:
          label: "Categoría"
          name: "category"
          widget: "string"

      - label: "Destinado a"
        name: "audience"
        widget: "string"
        hint: "Ej.: Infancias, Adolescentes, Adultos, Familias."

      - label: "Días y horarios"
        name: "schedule"
        widget: "list"
        required: false
        hint: "Agregá una o varias opciones de día y horario."

        fields:
          - label: "Día"
            name: "day"
            widget: "string"
            hint: "Ej.: Lunes"

          - label: "Horario"
            name: "time"
            widget: "string"
            hint: "Ej.: 18:00 a 20:00"

      - label: "Frecuencia"
        name: "frequency"
        widget: "string"
        required: false
        hint: "Ej.: Encuentro semanal"

      - label: "Duración"
        name: "duration"
        widget: "string"
        required: false

      - label: "Lugar"
        name: "location"
        widget: "string"
        default: "Casa Cubo"

      - label: "Precio"
        name: "price"
        widget: "number"
        value_type: "int"
        required: false

      - label: "Imagen principal"
        name: "image"
        widget: "image"

      - label: "Resumen"
        name: "excerpt"
        widget: "text"

      - label: "Instructores"
        name: "instructors"
        widget: "list"
        required: false

        fields:
          - label: "Nombre"
            name: "name"
            widget: "string"

          - label: "Rol / profesión"
            name: "role"
            widget: "string"
            required: false

          - label: "Foto"
            name: "image"
            widget: "image"
            required: false

      - label: "Qué incluye"
        name: "include"
        widget: "list"
        required: false

        field:
          label: "Ítem"
          name: "item"
          widget: "string"

      - label: "Qué traer"
        name: "bring"
        widget: "list"
        required: false

        field:
          label: "Ítem"
          name: "item"
          widget: "string"

      - label: "Formulario de inscripción"
        name: "form_url"
        widget: "string"
        required: false

      - label: "Contenido"
        name: "body"
        widget: "markdown"

      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "taller-regular.njk"

      - label: "Permalink"
        name: "permalink"
        widget: "hidden"
        default: "/crear-nuevos-mundos/{{slug}}/"

      - label: "Tags"
        name: "tags"
        widget: "hidden"
        default: "talleres_regulares"
  - name: "cumples"
    label: "Cumples"
    label_singular: "Opción de cumple"

    folder: "Casa_Cubo_Homepage_Integrada_Eventos/content/cumples"
    create: true
    path: "{{slug}}/index"

    media_folder: "Casa_Cubo_Homepage_Integrada_Eventos/assets/uploads"
    public_folder: "/assets/uploads"

    sortable_fields:
      - title
      - status
      - price

    summary: "{{title}}"

    fields:
      - label: "Título"
        name: "title"
        widget: "string"
        hint: "Ej.: Pintura en bastidor"

      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "Ej.: pintura-en-bastidor"

      - label: "Estado"
        name: "status"
        widget: "select"
        options:
          - "borrador"
          - "publicado"
        default: "borrador"

      - label: "Descripción corta"
        name: "excerpt"
        widget: "text"
        hint: "Texto que aparecerá en la tarjeta."

      - label: "Descripción completa"
        name: "description"
        widget: "markdown"

      - label: "Edad sugerida"
        name: "age"
        widget: "string"
        required: false
        hint: "Ej.: Desde 5 años"

      - label: "Duración"
        name: "duration"
        widget: "string"
        hint: "Ej.: 2 horas"

      - label: "Cantidad de participantes"
        name: "participants"
        widget: "string"
        required: false
        hint: "Ej.: Hasta 15 chicos/as"

      - label: "Precio"
        name: "price"
        widget: "number"
        value_type: "int"
        required: false

      - label: "Texto del precio"
        name: "price_text"
        widget: "string"
        required: false
        hint: "Ej.: por niño/a"

      - label: "Imagen principal"
        name: "cover_image"
        widget: "image"

      - label: "Carrusel de imágenes"
        name: "gallery"
        widget: "list"
        required: false
        summary: "{{fields.alt}}"

        fields:
          - label: "Imagen"
            name: "image"
            widget: "image"

          - label: "Descripción"
            name: "alt"
            widget: "string"
            required: false

      - label: "Qué incluye"
        name: "include"
        widget: "list"
        required: false

        field:
          label: "Ítem"
          name: "item"
          widget: "string"

      - label: "Cómo es la propuesta"
        name: "proposal"
        widget: "markdown"
        required: false

      - label: "Link de consulta"
        name: "contact_url"
        widget: "string"
        required: false
        default: "https://wa.me/5491141720467"

      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "cumple.njk"

      - label: "Permalink"
        name: "permalink"
        widget: "hidden"
        default: "/cumples/{{slug}}/"

      - label: "Tags"
        name: "tags"
        widget: "hidden"
        default: "cumples"     
